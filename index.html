<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordPress サイトへの接続</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .update-time {
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #0071e3;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0077ed;
        }
        .url-text {
            margin-top: 20px;
            font-size: 12px;
            color: #86868b;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WordPress サイトへのリンク</h1>
        <div class="update-time">最終更新日時: 2026-07-13 23:59:02</div>
        <a href="https://demonstrates-beings-feed-instances.trycloudflare.com" class="btn" target="_blank">サイトを開く</a>
        <a href="https://demonstrates-beings-feed-instances.trycloudflare.com/wp-admin/" class="btn" target="_blank">管理者画面を開く</a>
        <div class="url-text">https://demonstrates-beings-feed-instances.trycloudflare.com</div>
    </div>
</body>
</html>
